name: Deploy backend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-backend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate backend JavaScript syntax
        shell: bash
        run: |
          node --check server.js
          find src -name "*.js" -print0 | xargs -0 -n1 node --check

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build backend for Vercel
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy backend to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
