<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>ID Verified</title>
    <link rel="stylesheet" href="../css/formStyle.css" type="text/css" />
</head>

<body>
    <main class="form-container">
        <h2>Access <strong>BatFiles</strong></h2>
        <form id="loginForm" method="POST" novalidate>
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <div class="btnContainer">
                <button class="submit" type="submit">Unlock</button>
            </div>

            <div class="footer-links">
                <p><a href="/forgotPassword" class="bat-link">Forgot password?</a></p>

                <p><a href="/register" class="bat-link">Create new account</a></p>
            </div>
        </form>

        <p id="result" class="message"></p>
    </main>

    <script src="/js/login.js"></script>

</body>

</html>
