<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Batcave Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/formStyle.css" type="text/css" />
</head>

<body>
    
<main class="wide-container">
    <!--Boton de salida "Cierra sesion" y te envia nuevamente a login -->
    <a href="/login" class="link-btn btn-logout-top" style="padding: 8px 16px; font-size: 0.8rem;">
                 Exit Cave </a>
    <header class="hero">
        <div style="display: flex; justify-content: flex-end; width: 100%;">
        </div>
        <h1>Gotham Most Wanted</h1>
        <p>Accessing Arkham Asylum Criminal Files...</p>
    </header>
    <section id="criminal-grid" class="criminal-grid" aria-label="criminal dossiers">
        </section>
</main>
    <script>
        async function loadCriminals() {
            const grid = document.getElementById('criminal-grid');

            try {
                const response = await fetch('/api/criminals');
                const criminals = await response.json();

                // Dibujamos cada tarjeta usando Template Literals
                grid.innerHTML = criminals.map(villain => `
                <article class="card">
                    <div class="card-media">
                        <img src="${villain.image}" alt="${villain.alias}">
                    </div>
                    <div class="card-body">
                        <span class="chip">DANGER: ${villain.dangerLevel}</span>
                        <h3>${villain.alias}</h3>
                        <p><strong>Real Name:</strong> ${villain.name}</p>
                        
                        <div class="card-actions">
                  <a class="link-btn" href="/dossier?id=${villain.id}">View Full Dossier</a>          
                        </div>
                    </div>
                </article>
            `).join('');

            } catch (error) {
                grid.innerHTML = `<p class="error">System Breach: Could not retrieve data.</p>`;
            }
        }

        // Ejecutar al cargar la página
        window.onload = loadCriminals;
    </script>
</body>

</html>
