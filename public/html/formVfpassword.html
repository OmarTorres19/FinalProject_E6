<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Validate Forgot Password</title>
    <link rel="stylesheet" href="../css/formStyle.css" type="text/css" />
</head>
<body>
  <h2>Recover account 🦇</h2>

  <section class="panel" aria-label="Password recovery form">
    <form id="forgotForm" novalidate>
      <label for="forgot-email">Email:</label>
      <input type="email" id="forgot-email" required placeholder="example@email.com">
      <span class="message" id="error-forgot-email"></span>

      <div class="btnContainer">
        <button class="submit" type="button" id="loadQuestion">Load question</button>
        <button class="reset" type="reset">Clear</button>
      </div>

      <div id="recoveryFields" class="hidden">
        <p class="hint"><strong>Question:</strong> <span id="forgot-question"></span></p>

        <label for="forgot-answer">Answer:</label>
        <input type="password" id="forgot-answer" autocomplete="off" required>
        <span class="message" id="error-forgot-answer"></span>

        <label for="forgot-newpass">New password:</label>
        <input type="password" id="forgot-newpass" autocomplete="new-password" pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d).{8,}" required
          placeholder="Min 8 chars, 1 upper, 1 lower, 1 number">
        <span class="message" id="error-forgot-newpass"></span>

        <label for="forgot-confirm">Confirm new password:</label>
        <input type="password" id="forgot-confirm" autocomplete="new-password" required>
        <span class="message" id="error-forgot-confirm"></span>

        <div class="btnContainer">
          <button class="submit" type="submit">Reset password</button>
          <a class="reset link-btn" href="formUser.html">Back to login</a>
        </div>
      </div>

      <p class="helper">
        Remembered it? <a href="formUser.html">Go to login</a>
      </p>
    </form>
  </section>

  <pre id="result"></pre>

  <script src="../js/authForms.js"></script>
</body>

</html>
